[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-codebook"
version = "0.1.0"
description = "Writer-conditioned Q-K-V glyph codebook selection for NIST SD19"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "Pillow>=10", "numpy>=1.24", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
glyph-codebook-prepare = "glyph_codebook.cli.prepare:main"
glyph-codebook-train-encoder = "glyph_codebook.cli.train_encoder:main"
glyph-codebook-build = "glyph_codebook.cli.build_codebook:main"
glyph-codebook-train-selector = "glyph_codebook.cli.train_selector:main"
glyph-codebook-evaluate = "glyph_codebook.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
